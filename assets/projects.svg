<svg width="1160" height="640" viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow1" cx="50%" cy="0%" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .card-title { fill: #e6edf3; font-size: 22px; font-weight: 700; }
      .card-desc { fill: #8b949e; font-size: 15px; }
      .tag-text { fill: #58a6ff; font-size: 13px; }
      .tag-bg { fill: none; stroke: #1f6feb; stroke-width: 1; rx: 12; }
      .meta { fill: #6e7681; font-size: 13px; }
      .header-label { fill: #58a6ff; font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .header-cmd { fill: #8b949e; font-size: 15px; }
      .pinned { fill: #e6edf3; font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer frame -->
  <rect x="4" y="4" width="1152" height="632" rx="20" fill="#010409" stroke="#1f6feb" stroke-width="1.5"/>
  <rect x="4" y="4" width="1152" height="632" rx="20" fill="url(#glow1)"/>
  <rect x="4" y="4" width="1152" height="632" rx="20" fill="url(#glow2)"/>

