    <rect x="134" y="532" width="118" height="28" rx="14" class="tag-bg"/>
    <text x="193" y="550" class="mono tag-text" text-anchor="middle">regression</text>

    <text x="76" y="579" class="mono meta">★ 0   updated recently</text>
