  <g>
    <rect x="600" y="374" width="512" height="220" rx="12" class="card-bg"/>
    <rect x="600" y="374" width="512" height="46" rx="12" fill="#161b22"/>
    <circle cx="628" cy="397" r="4" fill="#58a6ff"/>
    <text x="644" y="402" class="mono" fill="#c9d1d9" font-size="14">patent-and-research</text>
